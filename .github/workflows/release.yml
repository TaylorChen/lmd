name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  publish-macos-arm64:
    name: Publish macOS ARM64
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish LMD
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: __VERSION__
          releaseName: LMD __VERSION__
          releaseBody: |
            本版本包含原生 Markdown 文件/文件夹拖拽，以及更轻量的按需大纲、知识和 AI 工具界面。

            此 macOS ARM64 安装包尚未使用 Apple Developer ID 签名或公证。首次打开时如被 Gatekeeper 阻止，请在 Finder 中右键 LMD 并选择“打开”。
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
