[package]
name = "lmd"
version = "0.1.0"
description = "A native Markdown editor for large documents"
authors = ["LMD"]
edition = "2021"

[lib]
name = "lmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
rfd = "0.15"
memmap2 = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSObject"] }
