[package]
name = "lmd"
version = "0.1.0"
description = "A native Markdown editor for large documents"
authors = ["LMD"]
edition = "2021"

[lib]
name = "lmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rfd = "0.15"

